<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EMBER - Music for Every Mood</title>
  <meta name="description" content="EMBER - Music for Every Mood. Sleek, obsidian dark and fiery orange mobile music player with live YouTube streaming.">
  
  <!-- Google Fonts: Outfit & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Master Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
  
  <link rel="icon" type="image/jpeg" href="assets/images/ember_logo.jpg">
</head>
<body>
  <!-- Centered Mobile App Shell Frame -->
  <div class="ember-app-shell">

    <!-- Top Navigation Header -->
    <header class="ember-top-header" id="ember-header">
      <div class="brand-wrapper" id="brand-home-btn">
        <div class="brand-flame-icon">
          <img src="assets/images/ember_logo.jpg" alt="Ember Logo">
        </div>
        <div class="brand-title-group">
          <h1><span>E</span>MBER</h1>
          <p>Music for every mood</p>
        </div>
      </div>

      <div class="header-icons">
        <button class="header-icon-btn" id="btn-header-bell" title="Notifications">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </button>
        <button class="header-avatar-btn" id="btn-header-profile" title="Vijender Singh Profile">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </button>
      </div>
    </header>

    <!-- Scrollable Viewport Container -->
    <main class="ember-content-body" id="ember-main-viewport">
      <!-- Dynamic Views: Home, Search, Playlist, Library, Profile -->
    </main>

    <!-- Persistent Bottom Mini Player Bar -->
    <div class="ember-mini-player" id="mini-player-bar">
      <!-- Top orange progress line -->
      <div class="mini-progress-line">
        <div class="mini-progress-fill" id="mini-progress-fill"></div>
      </div>

      <div class="mini-track-left" id="mini-track-click-area">
        <div class="mini-thumb-wrap">
          <img src="assets/images/ember_midnight.jpg" alt="Now Playing" id="mini-thumb">
        </div>
        <div class="mini-meta">
          <div class="mini-song-title" id="mini-title">Select a song</div>
          <div class="mini-song-artist" id="mini-artist">Ember Soundscape</div>
        </div>
      </div>

      <div class="mini-controls-right">
        <button class="mini-btn btn-like" id="mini-like-btn" title="Like Song">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
        <button class="mini-play-btn" id="mini-play-pause-btn" title="Play/Pause">
          <svg id="mini-play-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 18 12 6 20 6 4"/></svg>
          <svg id="mini-pause-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        </button>
        <button class="mini-btn" id="mini-next-btn" title="Next Song">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"/></svg>
        </button>
      </div>
    </div>

    <!-- Mobile Bottom Navigation Bar (4 Official Tabs) -->
    <nav class="ember-bottom-nav">
      <button class="nav-tab-item active" data-tab="home" id="tab-home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Home</span>
      </button>
      <button class="nav-tab-item" data-tab="search" id="tab-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span>Search</span>
      </button>
      <button class="nav-tab-item" data-tab="library" id="tab-library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span>Your Library</span>
      </button>
      <button class="nav-tab-item" data-tab="profile" id="tab-profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Profile</span>
      </button>
    </nav>

    <!-- Screen 8: Fullscreen "Now Playing" Sheet -->
    <div class="ember-now-playing-sheet" id="now-playing-sheet">
      <div class="sheet-header-bar">
        <button class="btn-sheet-icon" id="btn-sheet-collapse" title="Collapse">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <span class="sheet-screen-title">Now Playing</span>
        <button class="btn-sheet-icon" id="btn-sheet-options" title="More Options">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
        </button>
      </div>

      <div class="sheet-artwork-container">
        <img src="assets/images/ember_midnight.jpg" alt="Album Cover" id="sheet-artwork" class="sheet-artwork-img">
      </div>

      <div class="sheet-track-titles">
        <h2 id="sheet-title">Midnight</h2>
        <p id="sheet-artist">Ember</p>
      </div>

      <!-- Scrubber -->
      <div class="sheet-scrubber-wrapper">
        <div class="sheet-timeline-bar" id="sheet-timeline">
          <div class="sheet-timeline-fill" id="sheet-timeline-fill"></div>
          <div class="sheet-timeline-handle" id="sheet-timeline-handle"></div>
        </div>
        <div class="sheet-time-labels">
          <span id="sheet-time-cur">0:00</span>
          <span id="sheet-time-tot">0:00</span>
        </div>
      </div>

      <!-- Big Sheet Controls -->
      <div class="sheet-main-controls">
        <button class="sheet-ctrl-btn" id="sheet-shuffle-btn" title="Shuffle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
        </button>
        <button class="sheet-ctrl-btn" id="sheet-prev-btn" title="Previous">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button class="sheet-play-circle-btn" id="sheet-play-pause-btn" title="Play/Pause">
          <svg id="sheet-play-icon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"/></svg>
          <svg id="sheet-pause-icon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        </button>
        <button class="sheet-ctrl-btn" id="sheet-next-btn" title="Next">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button class="sheet-ctrl-btn" id="sheet-repeat-btn" title="Repeat">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </button>
      </div>

      <div class="sheet-bottom-actions">
        <button class="btn-bottom-icon" id="sheet-like-btn" title="Like Song">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
        <button class="btn-bottom-icon" id="sheet-toggle-video-btn" title="Watch Video">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/></svg>
          <span id="sheet-video-label">Video</span>
        </button>
        <button class="btn-bottom-icon" id="sheet-queue-btn" title="Queue">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        </button>
      </div>
    </div>

    <!-- Toast Notifications -->
    <div class="ember-toast-box" id="ember-toast-box"></div>

    <!-- Hidden YouTube Player Container (With Video Popup Support) -->
    <div class="hidden-yt-target" id="yt-player-wrapper">
      <button class="btn-close-video" id="btn-close-video" title="Close Video">✕</button>
      <div id="yt-player-target"></div>
    </div>

    <!-- Create Playlist Modal -->
    <div class="ember-modal-backdrop" id="create-playlist-modal" style="display:none;">
      <div class="ember-modal-card">
        <h3>Create Playlist</h3>
        <p style="font-size:0.75rem; color:var(--text-gray); margin-bottom:12px;">Add your own custom sound collection</p>
        <input type="text" id="new-playlist-title" placeholder="Playlist title..." class="ember-search-input" style="border:1px solid var(--border-subtle); padding:10px 14px; border-radius:12px; margin-bottom:16px; width:100%; background:var(--bg-black); color:#fff;">
        <div style="display:flex; gap:10px; justify-content:flex-end;">
          <button class="ember-pill" id="btn-cancel-create-pl">Cancel</button>
          <button class="ember-pill active" id="btn-confirm-create-pl">Create</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/yt-api.js"></script>
  <script src="js/player.js"></script>
  <script src="js/visualizer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
